# Replace the native model UI with the Harness-aware contribution, then add Grok Build.
- id: ui-model-selection
  name: '@deepseek-ai/dsh-client-ui-model-selection'
  disabled: true
- insert:
    - id: grok-acp
      name: dsh-grok-acp
      config:
        command: !!js process.env.GROK_COMMAND || 'grok'
        args: [agent, --no-leader, stdio]
        stateFile: !!js (process.env.DSH_HOME || (process.env.HOME + '/.dsh')) + '/grok-harness-sessions.json'
        yoloMode: false
        allowOutsideWorkspace: false
